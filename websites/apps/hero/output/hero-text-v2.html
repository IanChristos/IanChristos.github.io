<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">
  <title>My Hero Section</title>

  <link rel="preload" as="image" href="assets/img/hero-image.jpg">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">

    .hero {
      @apply relative flex items-center justify-center px-6 py-16 md:px-12 md:py-24 bg-cover bg-center overflow-hidden;
      background-image: url('assets/img/hero-image.jpg');
    }

    .hero-overlay {
      @apply absolute inset-0 pointer-events-none z-0;
    }

    .hero-content {
      @apply relative z-10 w-full max-w-5xl;
    }

    .hero h1 {
      @apply text-4xl font-bold leading-tight tracking-tight sm:text-5xl md:text-6xl text-shadow-lg/30;
      overflow-wrap: anywhere;
    }

    .hero h2 {
      @apply mt-6 max-w-3xl text-lg leading-relaxed sm:text-xl md:text-2xl text-shadow-lg/30;
      overflow-wrap: anywhere;
    }

    .hero-centre .hero-content {
      @apply mx-auto text-center;
    }

    .hero-centre h1,
    .hero-centre h2 {
      @apply mx-auto text-center;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    .text-shadow-lg\/30 {
      text-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
    }
  
  </style>
</head>
<body>

  <header class="hero hero-min-height">
    <div class="hero-overlay" aria-hidden="true" style="opacity: 0.4; background-image: linear-gradient(to left, #dc2626, #2563eb);"></div>
    <div class="hero-content">
      <h1 class="text-white font-sans tracking-wide">Lorem ipsum dolor sit amet</h1>
      <h2 class="text-white font-sans tracking-widest">Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>
    </div>
  </header>

</body>
</html>
